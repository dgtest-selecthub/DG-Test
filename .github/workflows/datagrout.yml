name: Build and Attest Artifact

on:
  workflow_dispatch:

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir -p dist
          echo "hello" > dist/artifact.txt

      - name: Attest artifact
        uses: actions/attest@v4
        with:
          subject-path: "./dist/artifact.txt"
