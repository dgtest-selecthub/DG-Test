name: Build and Attest Artifact

on:
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir -p dist
          echo "release build output" > dist/artifact.txt

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/artifact.txt
